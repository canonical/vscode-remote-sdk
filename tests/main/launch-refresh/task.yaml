summary: Launch and refresh a workshop with the vscode-remote SDK

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  workshop exec -- sh -c 'systemctl is-active --quiet ssh.socket || systemctl is-active --quiet ssh.service'
  IP=$(workshop exec -- hostname -I | awk '{print $1}')

  # Ensure we start from a clean known_hosts state for this IP.
  ssh-keygen -R "$IP" >/dev/null 2>&1 || true

  # First SSH connection seeds known_hosts and must succeed with empty password.
  printf '\n' | ssh \
    -o ConnectTimeout=10 \
    -o PreferredAuthentications=password \
    -o PubkeyAuthentication=no \
    -o NumberOfPasswordPrompts=1 \
    -o StrictHostKeyChecking=accept-new \
    workshop@"$IP" \
    'echo SSH_OK' | MATCH '^SSH_OK$'

  workshop restore

  workshop exec -- sh -c 'systemctl is-active --quiet ssh.socket || systemctl is-active --quiet ssh.service'

  # Second SSH connection must also succeed and must not trigger a host-key mismatch.
  printf '\n' | ssh \
    -o ConnectTimeout=10 \
    -o PreferredAuthentications=password \
    -o PubkeyAuthentication=no \
    -o NumberOfPasswordPrompts=1 \
    -o StrictHostKeyChecking=yes \
    workshop@"$IP" \
    'echo SSH_OK_AFTER_RESTORE' | MATCH '^SSH_OK_AFTER_RESTORE$'

debug: |
  workshop tasks
  workshop exec -- systemctl status ssh.service --no-pager || true
  workshop exec -- ls -l /etc/ssh/ssh_host_* || true
  IP=$(workshop exec -- hostname -I | awk '{print $1}')
  ssh-keygen -F "$IP" || true
