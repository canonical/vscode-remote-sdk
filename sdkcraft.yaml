name: vscode-remote
adopt-info: version
summary: VS Code Remote Development plugin support
description: |
  Deprecated. See https://ubuntu.com/workshop/docs/how-to/develop-with-workshops/connect-vscode/
license: GPL-3.0
website: https://github.com/canonical/vscode-remote-sdk
build-base: ubuntu@24.04
platforms:
  amd64:
  arm64:
plugs:
  vscode-server:
    interface: mount
    workshop-target: /home/workshop/.vscode-server
    mode: 0o700

parts:
  version:
    plugin: nil
    override-pull: |
      VERSION=$(cat "$CRAFT_PROJECT_DIR/VERSION")
      craftctl set version="$VERSION"
